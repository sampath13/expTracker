name: CI — OCR

on:
  push:
    paths:
      - "apps/ocr-service/**"
    branches: [main]
  pull_request:
    paths:
      - "apps/ocr-service/**"
    branches: [main]

defaults:
  run:
    working-directory: apps/ocr-service

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ocr-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v
